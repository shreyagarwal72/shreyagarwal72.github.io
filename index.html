<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Gantari:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />

    <!--=============== FAVICON ===============-->
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" type="image/x-icon" />

    <!--=============== BOXICONS ===============-->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

    <!--=============== BOOTSTRAP ============== -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="css/styles.css" />

    <title>Vanshu - Creative Mind</title>
    <meta name="description"
        content="Vanshu is a creative mind from India exploring web development, design, and innovation. Discover his works and creative projects.">
    <meta name="keywords"
        content="portfolio, personal, vanshu, creative, mind, web developer, designer, projects, github, linkedin, india">
    <meta name="robots" content="index, follow">
</head>
<body>
    <div class="container-fluid">
        <!-- Home Page -->
        <img src="assets/img/grid.png" alt class="home_grid" />
        <div class="row g-0 home_row align-items-center justify-content-center">
            <div class="col-lg-5 center-block self_details">
                <div class="greeting">Hi I'm</div>
                <div class="name"><span class="name_border">VANSHU</span></div>
                <div class="position">a Creative Mind</div>
            </div>
            <div class="col-lg-7 explorer_window_home">
                <div class="row">
                    <div class="link_bar">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
                <div class="row">
                    <div class="link_content">
                        <div class="row">
                            <div class="col-4 folder">
                                <div class="folder_box">
                                    <label class="folder_inner_box">
                                        <a href="#about">
                                            <input type="checkbox" class="folder_top" />
                                            <span class="document"></span>
                                        </a>
                                    </label>
                                </div>
                                <div class="folder_info">About</div>
                            </div>
                            <div class="col-4 folder">
                                <div class="folder_box">
                                    <label class="folder_inner_box">
                                        <a href="#work">
                                            <input type="checkbox" class="folder_top" />
                                            <span class="document"></span>
                                        </a>
                                    </label>
                                </div>
                                <div class="folder_info">Works</div>
                            </div>
                            <div class="col-4 folder">
                                <div class="folder_box">
                                    <label class="folder_inner_box">
                                        <a href="#contact">
                                            <input type="checkbox" class="folder_top" />
                                            <span class="document"></span>
                                        </a>
                                    </label>
                                </div>
                                <div class="folder_info">Contact</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row justify-content-center social_links">
                    <div class="col-4">
                        <a href="https://github.com/" target="_blank" alt="github">
                            <div class="social_icon_box">
                                <i class="bx bxl-github social_icon bx-md"></i>
                            </div>
                        </a>
                    </div>
                    <div class="col-4">
                        <a href="https://www.linkedin.com/" target="_blank" alt="linkedin">
                            <div class="social_icon_box">
                                <i class="bx bxl-linkedin-square social_icon bx-md"></i>
                            </div>
                        </a>
                    </div>
                    <div class="col-4">
                        <a href="https://www.instagram.com/" target="_blank" alt="instagram">
                            <div class="social_icon_box">
                                <i class="bx bxl-instagram bx-md"></i>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scroll down -->
        <div class="row g-0 justify-content-center">
            <div class="col-auto">
                <a href="#about">
                    <span class="scroll-icon">
                        <span class="scroll-icon__wheel-outer">
                            <div class="scroll-icon__wheel-inner"></div>
                        </span>
                    </span>
                </a>
            </div>
        </div>
        <div class="row g-0 justify-content-center scroll-text">
            <div class="col-auto">
                <span> Scroll down </span>
            </div>
        </div>

        <!-- About -->
        <div class="row g-0 justify-content-center align-items-center" id="about">
            <div class="col-lg-6 col-md-12">
                <div class="row g-0 about-row">
                    <div class="col-auto about-col">
                        <div class="about-bar">
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </div>
                        <div class="about-content">
                            <div class="row justify-content-center">
                                <div class="col-auto about-heading">
                                    <h1>About me</h1>
                                </div>
                            </div>
                            <div class="row justify-content-center">
                                <div class="col-auto about-description">
                                    Hi, I'm Vanshu, a creative mind passionate about web development, design, and experimenting with new ideas.  
                                    When I'm not building projects, I love to explore creativity in photography, art, and innovation. 
                                </div>
                            </div>
                            <div class="row justify-content-center">
                                <div class="col-auto">
                                    <a href="#" target="_blank" alt="resume">
                                        <div class="resume-link">
                                            <i class="bx bxs-file-pdf bx-md"></i>
                                            RESUME
                                        </div>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="shrey-gif-col">
                    <img src="assets/img/shrey_blinking_eye.gif" alt class="shrey_gif" />
                    <img src="assets/img/sparkle.png" alt class="sparkle sparkle-right" />
                    <img src="assets/img/sparkle.png" alt class="sparkle sparkle-left-2" />
                    <img src="assets/img/sparkle.png" alt class="sparkle sparkle-left" />
                </div>
            </div>
        </div>
    </div>
</body>
</html>
