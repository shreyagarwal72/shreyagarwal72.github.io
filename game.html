<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=https://nextup-studio.vercel.app/ai">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f3f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 420px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem;
      color: #111827;
    }
    p {
      font-size: 1rem;
      color: #6b7280;
      margin: 0 0 1.5rem;
    }
    a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Redirecting…</h1>
    <p>Taking you to the requested page.</p>
    <div class="spinner"></div>
    <p style="margin-top: 1.5rem; font-size: 0.875rem;">
      If you are not redirected automatically, <a href="https://nextup-studio.vercel.app/ai">click here</a>.
    </p>
  </div>
</body>
</html>
