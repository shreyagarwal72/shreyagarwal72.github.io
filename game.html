<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1" />  
  <title>Games - Nextup Studio</title>  
  <link rel="stylesheet" href="style.css" />
  <style>
    /* --- Same CSS as tumne bheja tha (sidebar, modal, buttons, responsive, light mode etc.) --- */
    body {
      margin:0; padding:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:#121212; color:white;
      transition: background 0.2s, color 0.2s;
    }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #1e1e1e; padding: 20px; box-sizing: border-box;
      display: flex; flex-direction: column; gap: 15px; height: 100vh; }
    .sidebar h2 { color: #00bcd4; margin-bottom: 20px; font-size: 22px; font-weight: 700; }
    .sidebar a { color: #f0f0f0; text-decoration: none; padding: 10px; border-radius: 5px; }
    .sidebar a.active, .sidebar a:hover { background: #00bcd4; color: #181818; font-weight: bold; }
    .main-content { flex: 1; padding: 30px; text-align: center; }
    button { background: #00bcd4; border: none; padding: 12px 20px; border-radius: 5px; margin:8px;
      cursor: pointer; font-weight: bold; color: #121212; font-size: 16px; }
    button:hover { background: #0097a7; color: white; }
    #leaderboard { max-width: 400px; margin: 20px auto 0; background: #222; padding: 15px; border-radius: 10px; color: #00bcd4; display: none; }
    #leaderboardList li { margin-bottom: 5px; }
    input[type="text"], input[type="number"] { padding: 8px; border-radius: 5px; border: none; font-size: 16px; width:80%; margin:10px 0; }
    #gameCanvas { margin-top: 20px; border: 2px solid #00bcd4; border-radius: 10px; background: #232; max-width: 100%; height: auto; }
    /* Modal */
    #customModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center; }
    #customModal .modal-content { background:#212e2e; color:#00bcd4; border-radius:18px; padding:25px; max-width:320px; text-align:center; }
    #customModal .modal-title { font-size:1.3em; font-weight:bold; margin-bottom:8px; color:#fff; }
    #customModal .modal-emoji { font-size:2.3em; margin-bottom:10px; }
    #customModal .close-btn { margin-top:15px; background:#00bcd4; color:#121212; border:none; padding:8px 20px; border-radius:8px; font-weight:bold; }
    /* Responsive */
    @media(max-width: 768px){ .layout{flex-direction:column;} .sidebar{width:100%;height:60px;flex-direction:row;justify-content:space-around;align-items:center;position:fixed;top:0;} .main-content{margin-top:70px;padding:15px;} button{width:100%; margin:6px 0;} }
  </style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <h2>Nextup Studio</h2>
    <a href="home.html">Home</a>
    <a href="yt.html">YouTube</a>
    <a href="journey.html">My Journey</a>
    <a href="game.html" class="active">Game</a>
  </div>
  <div class="main-content">
    <h1 id="gameTitle">Choose a Game to Play</h1>
    <div id="gameChoice">
      <p>Which game do you want to play?</p>
      <button onclick="loadGame('quiz')">Quiz Game</button>
      <button onclick="loadGame('hideSeek')">Hide and Seek</button>
      <button onclick="loadGame('ropeBridge')">Rope Bridge</button>
      <button onclick="loadGame('reactionTest')">Reaction Time Test</button>
      <button onclick="loadGame('crossRoad')">Cross the Road</button>
      <hr style="margin:20px 0; border-color:#0097a7;" />
      <button id="showLeaderboardBtn" onclick="showLeaderboard()">Show Leaderboard</button>
      <div id="leaderboard">
        <h3>Leaderboard - Top Scores</h3>
        <ol id="leaderboardList"></ol>
        <button id="closeLeaderboardBtn" onclick="hideLeaderboard()">Close Leaderboard</button>
      </div>
    </div>
    <div id="gameContainer"></div>
  </div>
</div>

<!-- Modal -->
<div id="customModal">
  <div class="modal-content" id="customModalContent"></div>
</div>

<script>
/* --- Custom Modal --- */
function showCustomModal(message, emoji='🎉', title='Result') {
  document.getElementById('customModalContent').innerHTML = `
    <div class="modal-emoji">${emoji}</div>
    <div class="modal-title">${title}</div>
    <div>${message}</div>
    <button class="close-btn" onclick="hideCustomModal()">OK</button>
  `;
  document.getElementById('customModal').style.display = 'flex';
}
function hideCustomModal(){ document.getElementById('customModal').style.display='none'; }

/* --- Leaderboard --- */
function saveScore(name, score, game){
  let data = JSON.parse(localStorage.getItem('leaderboard')||'[]');
  data.push({name,score,game});
  localStorage.setItem('leaderboard', JSON.stringify(data));
}
function showLeaderboard(){
  const lb = document.getElementById('leaderboard');
  lb.style.display='block';
  const list = document.getElementById('leaderboardList');
  list.innerHTML='';
  let data = JSON.parse(localStorage.getItem('leaderboard')||'[]');
  data.slice(-10).reverse().forEach(e=>{
    list.innerHTML += `<li>${e.name} - ${e.score} (${e.game})</li>`;
  });
}
function hideLeaderboard(){ document.getElementById('leaderboard').style.display='none'; }

/* --- Game Loader --- */
function loadGame(game){
  document.getElementById('gameChoice').style.display='none';
  document.getElementById('gameContainer').innerHTML='';
  if(game==='quiz') startQuiz();
  else if(game==='hideSeek') loadHideSeek();
  else if(game==='ropeBridge') loadRopeBridge();
  else if(game==='reactionTest') loadReactionTest();
  else if(game==='crossRoad') loadCrossRoad();
}

/* --- QUIZ --- */
const quizData=[{question:"Minecraft mein Nether ka portal kaise banta hai?",options:["Obsidian + Flint & Steel","Wood + Torch","Stone + Pickaxe","Diamond + Fire"],answer:"Obsidian + Flint & Steel"},
{question:"AI ka full form kya hai?",options:["Artificial Intelligence","Automatic Input","Android Interface","Auto Identification"],answer:"Artificial Intelligence"}];
let qIndex=0, qScore=0;
function startQuiz(){qIndex=0;qScore=0;renderQuiz();}
function renderQuiz(){
  const c=document.getElementById('gameContainer');
  if(qIndex>=quizData.length){
    c.innerHTML=`<h2>Quiz Over! Score: ${qScore}/${quizData.length}</h2><button onclick="startQuiz()">Retry</button>`;
    saveScore("Player",qScore,"Quiz");
    return;
  }
  let q=quizData[qIndex];
  c.innerHTML=`<h3>${q.question}</h3>`+q.options.map(o=>`<button onclick="checkQuiz('${o}')">${o}</button>`).join('');
}
function checkQuiz(opt){ if(opt===quizData[qIndex].answer) qScore++; qIndex++; renderQuiz(); }

/* --- HIDE & SEEK --- */
function loadHideSeek(){
  document.getElementById('gameContainer').innerHTML=`<button onclick="playHide()">Check Hide Status</button><p id="hsResult"></p>`;
}
function playHide(){
  if(Math.random()<0.5){ document.getElementById('hsResult').textContent="Found 😢"; }
  else { document.getElementById('hsResult').textContent="Safe 🎉"; saveScore("Player",1,"Hide&Seek"); }
}

/* --- ROPE BRIDGE --- */
let safePattern=[1,3,5,2,4], pi=0;
function loadRopeBridge(){
  document.getElementById('gameContainer').innerHTML=`<input id="step" type="number" min="1" max="5"/><button onclick="playBridge()">Cross</button><p id="rbRes"></p>`;
}
function playBridge(){
  let step=+document.getElementById('step').value;
  let safe=safePattern[pi]; pi=(pi+1)%safePattern.length;
  if(step===safe){ document.getElementById('rbRes').textContent="Safe!"; saveScore("Player",1,"RopeBridge"); }
  else { document.getElementById('rbRes').textContent="Fell 😢"; }
}

/* --- REACTION TEST --- */
let startTime, timeout;
function loadReactionTest(){
  document.getElementById('gameContainer').innerHTML=`<button id="rtBtn" disabled style="background:red;color:white;">Wait...</button><p id="rtRes"></p><button onclick="startRT()">Start</button>`;
}
function startRT(){
  const btn=document.getElementById('rtBtn'); const res=document.getElementById('rtRes');
  btn.textContent="Wait for Green"; btn.disabled=true; btn.style.background="red"; res.textContent="";
  timeout=setTimeout(()=>{btn.textContent="Click!"; btn.style.background="green"; btn.disabled=false; startTime=performance.now(); btn.onclick=()=>{
    let t=performance.now()-startTime; res.textContent=`${t.toFixed(0)} ms`; saveScore("Player",Math.max(0,3000-t),"Reaction"); btn.disabled=true;};},Math.random()*3000+1000);
}

/* --- CROSS THE ROAD --- */
function loadCrossRoad(){
  document.getElementById('gameContainer').innerHTML=`<canvas id="gameCanvas"></canvas>`;
  const canvas=document.getElementById('gameCanvas'); const ctx=canvas.getContext('2d');
  const GRID=40; let rows=10,cols=10; canvas.width=GRID*cols; canvas.height=GRID*rows;
  let player={x:5,y:9}; let cars=[{x:0,y:5,dir:1},{x:9,y:7,dir:-1}];
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#272"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="yellow"; ctx.fillRect(player.x*GRID,player.y*GRID,GRID,GRID);
    ctx.fillStyle="red"; cars.forEach(c=>ctx.fillRect(c.x*GRID,c.y*GRID,GRID,GRID));
  }
  function update(){
    cars.forEach(c=>{c.x+=c.dir; if(c.x<0)c.x=cols-1; if(c.x>=cols)c.x=0; if(c.x===player.x && c.y===player.y){showCustomModal("Hit by car!","💥","Game Over"); player.y=9; }});
    if(player.y===0){showCustomModal("Crossed safely!","🚦","Win"); saveScore("Player",1,"CrossRoad"); player.y=9;}
  }
  function loop(){update();draw();requestAnimationFrame(loop);}
  loop();
  document.addEventListener('keydown',e=>{
    if(e.key==="ArrowUp")player.y=Math.max(0,player.y-1);
    if(e.key==="ArrowDown")player.y=Math.min(rows-1,player.y+1);
    if(e.key==="ArrowLeft")player.x=Math.max(0,player.x-1);
    if(e.key==="ArrowRight")player.x=Math.min(cols-1,player.x+1);
  });
}
</script>
</body>
</html>
