<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Settings | Nextup Studio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="description" content="Customize your Nextup Studio experience. Change theme, notifications, privacy, font size, timezone, and more."/>
  <meta name="keywords" content="Nextup Studio, Settings, Theme, Privacy, Notifications, Vanshu Agarwal, Shrey"/>
  <meta name="author" content="Vanshu Agarwal"/>
  <meta property="og:title" content="Settings | Nextup Studio"/>
  <meta property="og:description" content="Manage your preferences on Nextup Studio — theme, privacy, notifications and more."/>
  <meta property="og:type" content="website"/>
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      min-height: 100vh;
      background: #121212;
      transition: background 0.3s, color 0.3s;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f0f0f0;
    }
    .settings-main {
      max-width: 640px;
      margin: 48px auto;
      padding: 36px;
      border-radius: 14px;
      background: #1e1e1e;
      box-shadow: 0 10px 32px rgba(0,188,212,0.1);
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .settings-main h1 {
      text-align: center;
      margin-bottom: 28px;
      color: #00bcd4;
      font-size: 2rem;
      font-weight: 800;
    }
    .settings-group {
      margin-bottom: 26px;
    }
    .settings-group label {
      font-weight: 700;
      display: block;
      margin-bottom: 8px;
      font-size: 1rem;
      color: #00bcd4;
    }
    .settings-group input,
    .settings-group select,
    .settings-group textarea {
      width: 100%;
      padding: 10px 12px;
      background: #121212;
      border: none;
      border-radius: 6px;
      color: #f0f0f0;
      font-size: 1rem;
      outline: none;
      margin-top: 2px;
      box-shadow: inset 0 2px 7px rgba(0,188,212,0.12);
      transition: all 0.3s ease;
      resize: vertical;
      min-height: 50px;
    }
    .settings-group input:focus,
    .settings-group select:focus,
    .settings-group textarea:focus {
      box-shadow: 0 0 8px 2px #00bcd4;
    }
    .settings-checkbox {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 600;
      color: #00bcd4;
      cursor: pointer;
      font-size: 1rem;
    }
    .settings-checkbox input {
      transform: scale(1.2);
      margin-right: 10px;
      accent-color: #00bcd4;
    }
    .settings-actions {
      text-align: center;
      margin-top: 20px;
    }
    .settings-actions button {
      background: #00bcd4;
      color: #121212;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      padding: 14px 48px;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 4px 14px rgba(0,188,212,0.6);
      transition: background 0.3s ease, transform 0.2s;
    }
    .settings-actions button:hover {
      background: #0097a7;
      color: #fff;
      transform: translateY(-2px);
    }
    .settings-back {
      display: block;
      text-align: center;
      color: #00bcd4;
      font-weight: 700;
      text-decoration: none;
      margin-top: 30px;
      font-size: 1rem;
      opacity: .85;
      transition: opacity 0.25s ease;
    }
    .settings-back:hover {
      opacity: 1;
      text-decoration: underline;
    }
    .settings-success {
      display: none;
      text-align: center;
      color: #10e890;
      margin-top: 25px;
      font-size: 1.2rem;
      font-weight: 600;
      animation: fadeSuccess 0.6s ease-in-out;
    }
    @keyframes fadeSuccess {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }
    /* Light mode */
    body.light-mode {
      background: #f9f9f9;
      color: #232323;
    }
    body.light-mode .settings-main {
      background: #ffffff;
      color: #222;
      box-shadow: 0 10px 32px rgba(0,188,212,0.12);
    }
    body.light-mode .settings-main h1 {
      color: #0097a7;
    }
    body.light-mode .settings-group label,
    body.light-mode .settings-checkbox {
      color: #007c91;
    }
    body.light-mode .settings-group input,
    body.light-mode .settings-group select,
    body.light-mode .settings-group textarea {
      background: #fff;
      color: #171a1b;
      border: 1px solid #ccc;
      box-shadow: inset 0 2px 7px rgba(0,124,145,0.08);
    }
    body.light-mode .settings-group input:focus,
    body.light-mode .settings-group select:focus,
    body.light-mode .settings-group textarea:focus {
      box-shadow: 0 0 8px 2px #007c91;
    }
    body.light-mode .settings-actions button {
      background: #007c91;
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,124,145,0.6);
    }
    body.light-mode .settings-actions button:hover {
      background: #005f63;
    }
    @media (max-width: 700px) {
      .settings-main {
        max-width: 95vw;
        padding: 24px 18px;
        margin: 20px auto;
      }
      .settings-main h1 {
        font-size: 1.6rem;
      }
      .settings-actions button {
        padding: 12px 36px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <main class="settings-main" id="settingsArea" role="form">
    <h1>⚙️ Settings</h1>
    <form id="settingsForm" autocomplete="off" novalidate>
      <div class="settings-group">
        <label for="displayName">Display Name</label>
        <input type="text" id="displayName" placeholder="Your display name" aria-label="Display Name"/>
      </div>
      <div class="settings-group">
        <label for="theme">Theme</label>
        <select id="theme" aria-label="Theme">
          <option value="auto">Auto (System)</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>
      <div class="settings-group">
        <div class="settings-checkbox">
          <input type="checkbox" id="notificationSound"/>
          <label for="notificationSound">Enable Notification Sounds</label>
        </div>
        <div class="settings-checkbox">
          <input type="checkbox" id="newsletter"/>
          <label for="newsletter">Receive Newsletter</label>
        </div>
        <div class="settings-checkbox">
          <input type="checkbox" id="productUpdates" checked/>
          <label for="productUpdates">Receive Product Updates</label>
        </div>
        <div class="settings-checkbox">
          <input type="checkbox" id="privacyMode"/>
          <label for="privacyMode">Enable Privacy Mode</label>
        </div>
      </div>
      <div class="settings-group">
        <label for="fontSize">Font Size</label>
        <select id="fontSize">
          <option value="small">Small</option>
          <option value="medium" selected>Medium</option>
          <option value="large">Large</option>
        </select>
      </div>
      <div class="settings-group">
        <label for="timezone">Timezone</label>
        <select id="timezone">
          <option value="default">System Default</option>
          <option value="IST">India Standard Time (IST)</option>
          <option value="UTC">Coordinated Universal Time (UTC)</option>
          <option value="EST">Eastern Standard Time (EST)</option>
          <option value="PST">Pacific Standard Time (PST)</option>
        </select>
      </div>
      <div class="settings-group">
        <label for="signature">Custom Signature</label>
        <textarea id="signature" placeholder="Your custom signature"></textarea>
      </div>
      <div class="settings-actions">
        <button type="submit">💾 Save Changes</button>
      </div>
    </form>
    <p class="settings-success" id="successMsg">✅ Settings saved successfully!</p>
    <a href="home.html" class="settings-back">← Back to Home</a>
  </main>

  <script>
    (function setThemeImmediately() {
      let mode = localStorage.getItem('themeMode');
      if(!mode || mode === 'auto'){
        if(window.matchMedia('(prefers-color-scheme: dark)').matches){
          document.body.classList.remove('light-mode');
        } else {
          document.body.classList.add('light-mode');
        }
      } else if(mode === 'light') {
        document.body.classList.add('light-mode');
      } else {
        document.body.classList.remove('light-mode');
      }
    })();

    document.addEventListener('DOMContentLoaded', function() {
      // Load saved settings
      const fields = ["displayName","theme","notificationSound","newsletter","productUpdates","privacyMode","fontSize","timezone","signature"];
      fields.forEach(f => {
        let el = document.getElementById(f);
        if(!el) return;
        if(el.type === "checkbox") el.checked = localStorage.getItem(f) === "true";
        else if(el.tagName === "SELECT") el.value = localStorage.getItem(f) || el.value;
        else if(el.tagName === "TEXTAREA" || el.type === "text") el.value = localStorage.getItem(f) || "";
      });

      // Theme change live
      document.getElementById('theme').addEventListener('change', function() {
        localStorage.setItem('themeMode', this.value);
        if(this.value === 'auto'){
          if(window.matchMedia('(prefers-color-scheme: dark)').matches){
            document.body.classList.remove('light-mode');
          } else {
            document.body.classList.add('light-mode');
          }
        } else if(this.value === 'light'){
          document.body.classList.add('light-mode');
        } else {
          document.body.classList.remove('light-mode');
        }
      });

      // Save form
      document.getElementById('settingsForm').addEventListener('submit', function(e){
        e.preventDefault();
        fields.forEach(f => {
          let el = document.getElementById(f);
          if(!el) return;
          if(el.type === "checkbox") localStorage.setItem(f, el.checked);
          else localStorage.setItem(f, el.value.trim());
        });
        const msg = document.getElementById("successMsg");
        msg.style.display = "block";
        setTimeout(()=> msg.style.display="none", 3000);
      });
    });
  </script>
</body>
</html>
